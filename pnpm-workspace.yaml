packages:
  - apps/*
  - packages/*
  - firebase
# Dependencies allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  unrs-resolver: true
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
  '@firebase/util': true
  # Not needed: version check (protobufjs) and optional native regex build (re2).
  protobufjs: false
  re2: false
